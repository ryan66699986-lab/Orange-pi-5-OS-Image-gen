name: Syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n build.sh native-artifacts.sh userpatches/customize-image.sh orangepi5pro-gaming/recipes/*.sh
