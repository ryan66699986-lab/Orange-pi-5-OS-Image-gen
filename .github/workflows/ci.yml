name: Static checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: ./tools/check.sh
  arm64-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned ARM64 binfmt handler
        run: docker run --privileged --rm tonistiigi/binfmt:qemu-v10.2.3-68 --install arm64
      - name: Execute ARM64 build-base and dependency smoke gates
        run: ./tools/container-smoke.sh
