name: Validate Armbian profile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and configuration assets
        run: |
          set -Eeuo pipefail
          bash -n customize-image.sh config-opi5pro.conf
          find extensions -type f -name '*.sh' -print0 | xargs -0 bash -n
          while IFS= read -r -d '' script; do
            if head -n1 "$script" | grep -q 'bash'; then
              bash -n "$script"
            fi
          done < <(find overlay/rootfs/usr/local/bin -type f -perm -u+x -print0)
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in [
              pathlib.Path('overlay/rootfs/usr/local/bin/opi-controller-nav'),
              pathlib.Path('overlay/rootfs/usr/local/bin/opi-game-exit-hotkey'),
          ]:
              compile(path.read_text(), str(path), 'exec')
          ET.parse('overlay/rootfs/usr/local/share/opi/es_systems.xml')
          PY
          grep -qx uinput overlay/rootfs/etc/modules-load.d/opi-controller.conf
          grep -qx uhid overlay/rootfs/etc/modules-load.d/opi-controller.conf
          grep -Fq HID_PLAYSTATION extensions/opi-native/opi-native.sh
          grep -Fq 'toggle_combo = guide+a' customize-image.sh
          grep -Fq 'opi-stremio-validate playback' README.md
          test ! -e overlay/rootfs/usr/local/bin/opi-audio-hdmi-default
          ! grep -Rqs 'opi-moonlight-display-auto' extensions overlay customize-image.sh

      - name: Resolve profile through current Armbian
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq rsync
          git clone --depth=1 https://github.com/armbian/build.git /tmp/armbian-build
          mkdir -p /tmp/armbian-build/userpatches
          rsync -a --exclude=.git/ ./ /tmp/armbian-build/userpatches/
          cd /tmp/armbian-build
          CONFIG_DEFS_ONLY=yes USE_TMPFS=no \
            ./compile.sh configdump opi5pro PREFER_DOCKER=no > /tmp/opi-config.raw
          # Armbian emits GitHub Actions group markers around stdout when CI=true.
          # Extract only the JSON object produced by configdump.
          sed -n '/^{/,/^}$/p' /tmp/opi-config.raw > /tmp/opi-config.json
          jq -e . /tmp/opi-config.json >/dev/null
          test "$(jq -r '.KERNEL_MAJOR_MINOR' /tmp/opi-config.json)" = 7.1
          test "$(jq -r '.LINUXCONFIG' /tmp/opi-config.json)" = linux-rockchip64-edge
          test "$(jq -r '.KERNELBRANCH' /tmp/opi-config.json)" = branch:linux-7.1.y
