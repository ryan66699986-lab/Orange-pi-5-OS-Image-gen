name: Native ARM64 recipe audit

on:
  push:
    paths:
      - '.github/workflows/native-recipe-audit.yml'
      - 'extensions/opi-native/recipes/arm64-common.sh'
      - 'extensions/opi-native/recipes/build-snes9x.sh'
      - 'extensions/opi-native/sources.env'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.name }} on native ARM64
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Snes9x
            recipe: build-snes9x.sh
            source_key: SNES9X_COMMIT
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned recipe
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m755 extensions/opi-native/recipes/arm64-common.sh /tmp/arm64-common.sh
          sudo install -m755 /tmp/arm64-common.sh /arm64-common.sh
          set -a
          source extensions/opi-native/sources.env
          set +a

          source_value="${!matrix_source_key}"
          sudo env JOBS=4 "${matrix_source_key}=${source_value}" \
            bash "extensions/opi-native/recipes/${{ matrix.recipe }}"
          test -d /out/rootfs
        env:
          matrix_source_key: ${{ matrix.source_key }}
