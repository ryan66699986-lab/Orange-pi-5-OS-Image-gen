BOARD=orangepi5pro
BRANCH=edge
RELEASE=resolute

BUILD_MINIMAL=no
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
EXPERT=yes

ROOTFS_TYPE=ext4
COMPRESS_OUTPUTIMAGE=img
NETWORKING_STACK=network-manager

enable_extension "opi-native"

PACKAGE_LIST_ADDITIONAL="greetd tuigreet gamescope labwc foot wvkbd xwayland seatd dbus-user-session pipewire-audio pipewire-jack wireplumber libspa-0.2-bluetooth alsa-utils pavucontrol playerctl bluez blueman network-manager network-manager-gnome swaybg waybar mako-notifier udiskie policykit-1-gnome libfuse2t64 desktop-file-utils xdg-utils xdg-user-dirs locales mesa-utils mesa-vulkan-drivers vulkan-tools v4l-utils libinput-tools joystick evtest python3-evdev edid-decode gamemode btrfs-progs nvme-cli smartmontools git curl ca-certificates jq unzip firefox dolphin-emu dolphin-emu-data mgba-qt sameboy nestopia"
