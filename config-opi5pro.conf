# Orange Pi 5 Pro custom image: standard Armbian XFCE desktop build plus project applications.
BOARD=orangepi5pro
BRANCH=current
RELEASE=resolute

# Pin the Linux 6.18.48 stable commit used by this image.
KERNELBRANCH=commit:5bbb9c9f8f808710e2123f2b30f0d61d7d698f52

BUILD_MINIMAL=no
BUILD_DESKTOP=yes
DESKTOP_ENVIRONMENT=xfce
DESKTOP_TIER=mid
KERNEL_CONFIGURE=no
EXPERT=yes

ROOTFS_TYPE=ext4
COMPRESS_OUTPUTIMAGE=sha,img
NETWORKING_STACK=network-manager

enable_extension "opi-native"
